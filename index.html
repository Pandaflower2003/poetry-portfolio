<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>POETRY</title>
  <style>
    :root {
      --bg: #f2f2f2;
      --text: #1a1a1a;
      --header-bg: rgba(242, 242, 242, 0.88);
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.06);
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --text: #f0f0f0;
        --header-bg: rgba(10, 10, 10, 0.88);
        --card-bg: #1a1a1a;
        --card-border: rgba(255, 255, 255, 0.06);
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      transition: background-color 0.4s ease, color 0.4s ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    /* Fixed header - NO bottom line/border */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 16px 24px;
      text-align: center;
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--text);
    }

    /* Scroll container */
    .feed {
      padding-top: 64px;
      padding-bottom: 40px;
      padding-left: 20px;
      padding-right: 20px;
    }

    /* Each stack group */
    .group {
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }

    .stack {
      position: relative;
      display: block;
      /* 手机端（<768px）：最终会被 JS 写像素 width/height 覆盖，这里只做首帧兜底。
         电脑端（≥768px）：JS 不写内联，完全依赖 CSS aspect-ratio + CSS columns 多列布局。 */
      width: 100%;
      max-width: 360px;
      max-height: none;
      aspect-ratio: 2 / 3;
    }

    /* ══════════════════════════════════════════════════════════════
     *  电脑端：单列 → 多列瀑布流（参考小红书 / Pinterest 样式）
     *  手机端严禁改动：下面所有规则都包在 @media (min-width: 768px) 里，
     *  手机视口不会命中任何一条，布局和交互 100% 保持原样。
     * ══════════════════════════════════════════════════════════════ */
    @media (min-width: 768px) {
      .feed {
        /* 左右留白更宽，整屏居中，避免超宽屏无限拉伸 */
        max-width: 1440px;
        margin: 0 auto;
        padding-left: 48px;
        padding-right: 48px;
        padding-top: 80px;
        padding-bottom: 80px;

        /* 768~1199 显示 3 列，≥1200 显示 4 列 —— 和参考图一致的瀑布流 */
        column-count: 3;
        column-gap: 28px;
      }

      @media (min-width: 1200px) {
        .feed {
          column-count: 4;
          column-gap: 32px;
        }
      }

      .group {
        /* 关键：不让一组（含同组 2~3 张堆栈 + 外间距）被 columns 折断跨列显示 */
        break-inside: avoid;
        page-break-inside: avoid;
        -webkit-column-break-inside: avoid;
        /* 不再 flex 居中（单列时才需要），瀑布流时直接占满每列宽度 */
        display: block;
        padding: 0 0 32px;
      }

      .stack {
        /* 电脑端撑满每列宽度，不再受手机端 360px 上限卡死 */
        max-width: none;
        /* 高度按内联 style.aspect-ratio（每组自己的真实比例）自动算 */
      }

      /* ══════════════════════════════════════════════════════════════
       *  电脑端 hover 才展开堆栈：
       *    · 默认（未悬停）：.l1/.l2/.l3 全部缩回和 .l0 完全重合 + opacity=0，
       *      视觉上只剩 1 张图，看起来像整齐的卡片网格。
       *    · 鼠标悬停在 .group 上：恢复原堆栈的错位偏移 + 暗化 + 透明度，
       *      300ms 平滑过渡，符合「放上去才露堆栈」的交互预期。
       *    · 手机端 <768px：此 @media 不命中，.l1/.l2 默认始终展开，
       *      用户一眼看到有好几层可以左右划，完全不变。
       * ══════════════════════════════════════════════════════════════ */
      .stack .card.l1,
      .stack .card.l2,
      .stack .card.l3 {
        transition:
          transform 300ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 280ms ease,
          opacity 260ms ease;
      }

      .stack .card.l1 {
        transform: translate(0, 0) scale(1);
        filter: brightness(1);
        opacity: 0;
      }

      .stack .card.l2 {
        transform: translate(0, 0) scale(1);
        filter: brightness(1);
        opacity: 0;
      }

      .stack .card.l3 {
        transform: translate(0, 0) scale(1);
        filter: brightness(1);
        opacity: 0;
      }

      /* hover 时恢复原堆栈层级 */
      .group:hover .stack .card.l1 {
        transform: translate(18px, 10px) scale(0.95);
        filter: brightness(0.78);
        opacity: 0.90;
      }

      .group:hover .stack .card.l2 {
        transform: translate(34px, 20px) scale(0.89);
        filter: brightness(0.58);
        opacity: 0.72;
      }

      .group:hover .stack .card.l3 {
        transform: translate(46px, 26px) scale(0.85);
        filter: brightness(0.35);
        opacity: 0;
        /* 最底层本来就是半透明虚影，hover 时保持一致 */
      }
    }


    /*
     * 卡片尺寸：直接用 width/height:100%。
     *
     * 为什么不用四边定位(top/left/right/bottom:0)+auto？
     *   因为在微信X5里，如果父容器用了 height:0 + padding-top 的黑科技，
     *   X5 会在「宽度」计算上犯迷糊：它算出来的 card 宽度比实际容器窄，
     *   导致 object-fit:cover 把图片左右裁得很紧（图1 vs 图2 的宽度差）。
     * 改成 width:100%; height:100%; 加上下面 ResizeObserver 动态给父级 .stack
     * 设置实际像素 height，就能 100% 精确对齐，两边浏览器都一致。
     */
    .card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      pointer-events: none;
      will-change: transform, opacity;
    }

    .card.active {
      pointer-events: auto;
      cursor: grab;
    }

    .card.active:active {
      cursor: grabbing;
    }

    .card img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* ★ 单击图片放大灯箱：必须接收点击，不再 pointer-events: none
         同时保留无拖拽 / 无长按系统菜单 / 无选中，不影响滑动手势 */
      pointer-events: auto;
      cursor: zoom-in;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    /* Stack layers - offset to the RIGHT to show stacking */
    .card.l0 {
      transform: translate(0, 0) scale(1);
      z-index: 10;
      filter: brightness(1);
      opacity: 1;
    }

    .card.l1 {
      transform: translate(18px, 10px) scale(0.95);
      z-index: 9;
      filter: brightness(0.78);
      opacity: 0.90;
    }

    .card.l2 {
      transform: translate(34px, 20px) scale(0.89);
      z-index: 8;
      filter: brightness(0.58);
      opacity: 0.72;
    }

    .card.l3 {
      transform: translate(46px, 26px) scale(0.85);
      z-index: 7;
      filter: brightness(0.35);
      opacity: 0;
    }

    /* ══════════════════════════════════════════════════════════════
       关灯箱时的「无缝升顶」过渡：
       · 灯箱放大图飞回（0.35s）的同一时刻，stack 里所有卡片也一起平滑
         重排到新层级（例如第 3 张从底下 l2 位置升上来变成顶层 l0）。
       · 只在 closeLightbox 调用瞬间临时给 stack 加 is-syncing，
         动画结束后立刻移除，不影响正常的左右滑动动画。
       ══════════════════════════════════════════════════════════════ */
    .stack.is-syncing .card {
      transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.35s ease,
        opacity 0.35s ease,
        box-shadow 0.35s ease;
    }

    /* Swipe animations */
    .card.swipe-out-left {
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease !important;
      transform: translate(-120%, 20px) rotate(-10deg) scale(0.92) !important;
      opacity: 0 !important;
    }

    .card.swipe-out-right {
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease !important;
      transform: translate(120%, 20px) rotate(10deg) scale(0.92) !important;
      opacity: 0 !important;
    }

    /* Dragging state */
    .card.dragging {
      transition: none !important;
    }

    /* Desktop */
    @media (min-width: 768px) {
      .header h1 {
        font-size: 32px;
        letter-spacing: 7px;
      }

      .feed {
        padding-top: 90px;
        padding-bottom: 80px;
      }

      .stack {
        max-width: 360px;
      }

      .group {
        padding: 20px 0;
      }
    }

    /* ══════════════════════════════════════════════════════════════
     * 点击放大灯箱（毛玻璃背景 + 点击图片从原位放大到全屏）
     * ══════════════════════════════════════════════════════════════ */

    /* 毛玻璃遮罩 —— 背景层模糊（整层覆盖当前页面内容）*/
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      /* 两层底色兜底：先半透明黑 → 再叠 backdrop-filter 毛玻璃
         老设备不支持 backdrop-filter 时至少有半透明黑可用 */
      background-color: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(26px) saturate(1.4);
      -webkit-backdrop-filter: blur(26px) saturate(1.4);
      cursor: zoom-out;
      opacity: 0;
      /* 毛玻璃淡入和图片放大保持同样的时长，视觉上浑然一体 */
      transition: opacity 0.38s ease;
      will-change: opacity;
    }

    .lightbox.is-open {
      display: flex;
      opacity: 1;
    }

    @media (prefers-color-scheme: light) {
      .lightbox {
        background-color: rgba(255, 255, 255, 0.42);
      }
    }

    /* 图片本体 —— 用 contain 保证整图完整看到，不留裁边 */
    .lightbox-img {
      max-width: 92vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 14px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        0 4px 16px rgba(0, 0, 0, 0.18);
      transform-origin: center center;
      will-change: transform, opacity;
      -webkit-user-drag: none;
      user-select: none;
      -webkit-touch-callout: none;
      pointer-events: none;
      /* 点击图片=点到遮罩，直接关，不用再区分点图还是点背景 */
    }

    /* 关闭按钮（右上角 X）—— 手机主要靠点空白关，但桌面端用户习惯找 X */
    .lightbox-close {
      position: absolute;
      top: max(env(safe-area-inset-top, 0px), 16px);
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: 22px;
      line-height: 38px;
      cursor: pointer;
      z-index: 1;
      padding: 0;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-close::before,
    .lightbox-close::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
    }

    .lightbox-close::before {
      transform: rotate(45deg);
    }

    .lightbox-close::after {
      transform: rotate(-45deg);
    }

    @media (prefers-color-scheme: light) {
      .lightbox-close {
        background: rgba(0, 0, 0, 0.12);
        color: #111;
      }
    }

    /* 打开动画：从被点中的那张小图「飞过来放大」的 FLIP 效果
       —— 全程 opacity=1，所以用户看到的是那张图自己逐渐放大，没有淡入淡出的断层感。
       等大图 ready 了才启动过渡，避免"白一下再动"。 */
    .lightbox-img.is-animating {
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lightbox-img.is-animating.is-closing {
      transition: transform 0.34s cubic-bezier(0.4, 0, 0.84, 0.42);
    }

    /* 左右切换箭头（桌面端明显，手机端也能点）*/
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .lightbox-prev {
      left: calc(env(safe-area-inset-left, 0px) + 14px);
    }

    .lightbox-next {
      right: calc(env(safe-area-inset-right, 0px) + 14px);
    }

    .lightbox-prev:hover,
    .lightbox-next:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-50%) scale(1.05);
    }

    .lightbox-prev:active,
    .lightbox-next:active {
      transform: translateY(-50%) scale(0.94);
    }

    /* 箭头用 CSS pseudo 画 < 和 >，不依赖图标库 */
    .lightbox-prev::before,
    .lightbox-next::before {
      content: '';
      width: 12px;
      height: 12px;
      border-top: 2.5px solid currentColor;
      border-right: 2.5px solid currentColor;
      border-radius: 2px;
    }

    .lightbox-prev::before {
      transform: rotate(-135deg);
      margin-left: 4px;
    }

    /* <  */
    .lightbox-next::before {
      transform: rotate(45deg);
      margin-right: 4px;
    }

    /* >  */

    @media (prefers-color-scheme: light) {

      .lightbox-prev,
      .lightbox-next {
        background: rgba(0, 0, 0, 0.12);
        color: #111;
      }

      .lightbox-prev:hover,
      .lightbox-next:hover {
        background: rgba(0, 0, 0, 0.22);
      }
    }

    /* ══════════════════════════════════════════════════════════════
       手机端隐藏箭头 + 关闭按钮（用户要求：手机端保持干净，全靠手势操作）
       桌面端（≥768px）保留按钮：电脑用户习惯找 ◀ ▶ ✕ 操作
       ══════════════════════════════════════════════════════════════ */
    @media (max-width: 767px) {

      .lightbox-prev,
      .lightbox-next,
      .lightbox-close {
        display: none !important;
      }
    }

    /* 底部图片计数器（如「1 / 3」），手机端主要靠它知道一组有多少张 */
    .lightbox-counter {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(env(safe-area-inset-bottom, 0px), 24px);
      text-align: center;
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.08em;
      z-index: 1;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      opacity: 0.85;
    }

    @media (prefers-color-scheme: light) {
      .lightbox-counter {
        color: #111;
        text-shadow: 0 2px 6px rgba(255, 255, 255, 0.5);
      }
    }

    /* 灯箱内切换图片的过渡：
       下一张(dr=+1) → 旧图往左飞出、新图从右飞入
       上一张(dr=-1) → 旧图往右飞出、新图从左飞入  */
    .lightbox-img.is-switching {
      /* 切换时单独加一条 transition，时长比 FLIP 短一点，显得更跟手 */
      transition:
        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.24s ease;
    }

    /* 灯箱打开时，锁定 body 滚动，否则遮罩层出来用户还能滑底下页面 */
    body.lightbox-open {
      overflow: hidden;
      touch-action: none;
    }
  </style>
</head>

  <main class="feed" id="feed"></main>

  <script>

            'https://www.poetryportfolio.icu/wp-content/uploads/2026/08/image_1785184034380_2393035000721026727059.jpg',
            'https://www.poetryportfolio.icu/wp-content/uploads/2026/08/image_1785184026985_7949219509588376928119-1024x1536.jpg',

      // ║                                                            ║

      // -------------------------------------------------------------
      // ╔══════════════════════════════════════════════════════════════╗

      // ╠══════════════════════════════════════════════════════════════╣

      // ║  · 所有组宽度像素级一致，和图片比例无关                       ║
      // ║  · 高度按各自比例自动算，不设上限，图片不会被裁切             ║
      // ║  · 调边距方法：同时改以下两处（保持一致）：                   ║
      // ║     1) CSS  .feed { padding-left/right: 30px }               ║
      // ║     2) JS   FEED_LR_PADDING = 60  (= 左右 padding 之和)      ║
      // ╚══════════════════════════════════════════════════════════════╝

          //     → 所有组同一个宽度，和图片比例**完全无关**

      // Build all groups

      // Stack controller factory

        //

            el.style.filter = '';

            }

            // Prev card: spring overshoot for a natural "landing" feel, opacity fades in quicker
            prevCard.style.transition = 'transform 0.55s cubic-bezier(0.34, 1.25, 0.64, 1), opacity 0.4s ease, filter 0.5s ease';
            // Active card: ease-out, slightly shorter so it settles before the prev card lands
            activeCard.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease, filter 0.5s ease';
            void prevCard.offsetWidth;

            // Animate prev card in to l0 position
            prevCard.style.transform = 'translate(0, 0) scale(1) rotate(0deg)';
            prevCard.style.opacity = '1';
            prevCard.style.filter = 'brightness(1)';

            // Animate active card sinking to l1
            activeCard.style.transform = 'translate(18px, 10px) scale(0.95)';
            activeCard.style.opacity = '0.90';
            activeCard.style.filter = 'brightness(0.78)';

            setTimeout(() => {
              cur = prevIdx;
              render();
              animating = false;
            }, 570);
          }
        }

        function onPointerDown(e) {
          if (animating) return;
          dragging = true;
          startX = e.clientX;
          startY = e.clientY;
          lastX = startX;
          startTime = performance.now();
          axisLocked = null;
          _swipeTraced = false;  // 新手势开始：清零「是否拖过」标记

          const activeCard = cards[cur];
          activeCard.classList.add('dragging');
          if (activeCard.setPointerCapture) {
            try { activeCard.setPointerCapture(e.pointerId); } catch (err) { }
          }
          e.stopPropagation();
        }

        function onPointerMove(e) {
          if (!dragging) return;
          let dx = e.clientX - startX;
          let dy = e.clientY - startY;

          if (!axisLocked && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
            axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
          }

          if (axisLocked === 'y') {
            cancelDrag();
            return;
          }

          if (axisLocked !== 'x') return;

          // 只要进入水平拖拽、位移 ≥12px（点击过程中手指难免会微动几像素，
          // 12px 大约是正常人"无意识抖动"上限的 2~3 倍）→ 立刻写互斥锁，
          // 防止 onPointerUp 后浏览器派发出的 click 被误当"点击放大"。
          if (Math.abs(dx) >= 12) markSwipeTrace();

          lastX = e.clientX;
          const activeCard = cards[cur];
          const progress = Math.min(Math.abs(dx) / 220, 1);

          if (dx < 0) {
            // SWIPE LEFT (next): active follows finger left, next card rises up
            const rot = dx * 0.02;
            const op = 1 - Math.abs(dx) / 350;
            activeCard.style.transform = `translate(${dx}px, ${dx * 0.08}px) rotate(${rot}deg)`;
            activeCard.style.opacity = Math.max(op, 0.1);

            const nextIdx = (cur + 1) % N;
            if (nextIdx !== cur) {
              const nextCard = cards[nextIdx];
              nextCard.style.transform = `translate(${18 - progress * 18}px, ${10 - progress * 10}px) scale(${0.95 + progress * 0.05})`;
              nextCard.style.opacity = 0.90 + progress * 0.10;
              nextCard.style.filter = `brightness(${0.78 + progress * 0.22})`;
            }
          } else {
            // SWIPE RIGHT (previous): active sinks to l1, prev card slides in from left
            activeCard.style.transform = `translate(${18 * progress}px, ${10 * progress}px) scale(${1 - 0.05 * progress})`;
            activeCard.style.opacity = 1 - 0.10 * progress;
            activeCard.style.filter = `brightness(${1 - 0.22 * progress})`;

            const prevIdx = (cur - 1 + N) % N;
            if (prevIdx !== cur) {
              const prevCard = cards[prevIdx];
              prevCard.style.zIndex = '20';
              prevCard.style.transform = `translate(${-120 * (1 - progress)}%, ${20 * (1 - progress)}px) rotate(${-10 * (1 - progress)}deg) scale(${0.92 + 0.08 * progress})`;
              prevCard.style.opacity = progress;
              prevCard.style.filter = 'brightness(1)';
            }
          }

          e.stopPropagation();
        }

        function onPointerUp(e) {
          if (!dragging) return;
          dragging = false;

          const dx = lastX - startX;
          const dt = performance.now() - startTime;
          const v = dt > 0 ? dx / dt : 0;

          const threshold = Math.min(window.innerWidth * 0.12, 70);
          const velocityThreshold = 0.25;

          const activeCard = cards[cur];
          activeCard.classList.remove('dragging');

          if (dx < -threshold || v < -velocityThreshold) {
            go(1, true);
          } else if (dx > threshold || v > velocityThreshold) {
            go(-1, true);
          } else {
            // Snap back — reset all inline styles
            // ★ 如果拖过一定距离（超过切换阈值一半，即明显有过"想拖"的意图但没拖过线）
            //   也记为滑动痕迹（避免拖到 40% 又松手回弹时误放大）
            if (Math.abs(dx) >= threshold * 0.5) markSwipeTrace();

            activeCard.style.transform = '';
            activeCard.style.opacity = '';
            activeCard.style.filter = '';

            const nextIdx = (cur + 1) % N;
            const nextCard = cards[nextIdx];
            if (nextCard && nextIdx !== cur) {
              nextCard.style.transform = '';
              nextCard.style.opacity = '';
              nextCard.style.filter = '';
            }

            const prevIdx = (cur - 1 + N) % N;
            const prevCard = cards[prevIdx];
            if (prevCard && prevIdx !== cur) {
              prevCard.style.transform = '';
              prevCard.style.opacity = '';
              prevCard.style.filter = '';
              prevCard.style.zIndex = '';
            }
          }

          if (activeCard.releasePointerCapture && e.pointerId !== undefined) {
            try { activeCard.releasePointerCapture(e.pointerId); } catch (err) { }
          }

          // ★ 关键：在 onPointerUp 的**最末尾** commit 互斥锁
          //    这样标记的时间戳 = 真正松手时刻。
          //    然后我们在 onUp 判定里查 180ms 窗口，刚好把「同一个手势的 onUp/mouseup」
          //    事件挡住，而不会杀死「下一次重新点击」。
          commitSwipeEnd();
        }

        function cancelDrag() {
          if (!dragging) return;
          dragging = false;
          _swipeTraced = false;  // 手势中断：复位标记（避免下次点击被连带锁）
          const activeCard = cards[cur];
          activeCard.classList.remove('dragging');
          activeCard.style.transform = '';
          activeCard.style.opacity = '';
          activeCard.style.filter = '';

          const nextIdx = (cur + 1) % N;
          const nextCard = cards[nextIdx];
          if (nextCard && nextIdx !== cur) {
            nextCard.style.transform = '';
            nextCard.style.opacity = '';
            nextCard.style.filter = '';
          }

          const prevIdx = (cur - 1 + N) % N;
          const prevCard = cards[prevIdx];
          if (prevCard && prevIdx !== cur) {
            prevCard.style.transform = '';
            prevCard.style.opacity = '';
            prevCard.style.filter = '';
            prevCard.style.zIndex = '';
          }
        }

        stackEl.addEventListener('pointerdown', onPointerDown);
        stackEl.addEventListener('pointermove', onPointerMove);
        stackEl.addEventListener('pointerup', onPointerUp);
        stackEl.addEventListener('pointercancel', onPointerUp);
        stackEl.addEventListener('pointerleave', onPointerUp);
        stackEl.addEventListener('contextmenu', e => e.preventDefault());

        // ============================================================
        // 【首次进入轻推提示】：模拟一次轻微的"左滑"，让用户知道
        //  卡片堆里有更多图片、可以左右滑动切换。
        //  只触发一次，且全局只会有一组（第一组）被允许提示。
        // ============================================================
        var nudged = false;

        function nudge() {
          if (nudgingLocked || nudged || N < 2 || animating) return;
          nudged = true;
          nudgingLocked = true;

          var activeCard = cards[cur];
          var nextIdx = (cur + 1) % N;
          var nextCard = (nextIdx !== cur) ? cards[nextIdx] : null;

          // ──── ★ 自动滑动动画参数（可根据手感调整） ────────────
          // duration1   : 左滑"推出去"过程时长（毫秒）。越大越慢。
          // progressMax : 第二张卡片从"层级2"升到"层级1"的程度，0~1。
          //               越大第二张卡显得越"被翻出来"，默认 0.4 比较克制。
          // dxMax       : 当前卡片向左位移像素（负数=向左）。越大越夸张。
          // holdMs      : 到达最大位移后"停留"的时间，让用户看清。
          // snapMs      : 回弹到原位的时长。
          // cleanupMs   : 清理内联样式的时间（比snapMs略大20ms即可）。
          // ────────────────────────────────────────────────────────
          var duration1 = 480;   // ★ 阶段1（推出去）时长，毫秒
          var progressMax = 0.40;  // ★ 后层卡片升起的程度（0不升起，1完全升起）
          var dxMax = -90;   // ★ 顶部卡片左滑最大位移（像素，负=左）
          var holdMs = 260;   // ★ 推到最远后停多久再弹回（毫秒）
          var snapMs = 450;   // ★ 弹回原位动画时长（毫秒）
          var cleanupMs = 470;   // ★ 弹回后清理内联样式的延迟（比snapMs大20即可）

          var t0 = performance.now();
          activeCard.style.transition = 'none';
          if (nextCard) nextCard.style.transition = 'none';

          function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
          function easeInCubic(t) { return t * t * t; }

          function phase1() {
            var p = Math.min(1, (performance.now() - t0) / duration1);
            var ep = easeOutCubic(p);
            var dx = dxMax * ep;
            var prog = progressMax * ep;
            var rot = dx * 0.02;
            var op = 1 - Math.abs(dx) / 350;

            activeCard.style.transform = 'translate(' + dx + 'px, ' + (dx * 0.08) + 'px) rotate(' + rot + 'deg)';
            activeCard.style.opacity = Math.max(op, 0.1);

            if (nextCard) {
              nextCard.style.transform = 'translate(' + (18 - prog * 18) + 'px, ' + (10 - prog * 10) + 'px) scale(' + (0.95 + prog * 0.05) + ')';
              nextCard.style.opacity = 0.90 + prog * 0.10;
              nextCard.style.filter = 'brightness(' + (0.78 + prog * 0.22) + ')';
            }

            if (p < 1) requestAnimationFrame(phase1);
            else {
              // 阶段2：停 holdMs 毫秒后，用 CSS 过渡平滑地弹回原位
              setTimeout(function () {
                var easeBack = 'cubic-bezier(0.22,1,0.36,1)';
                var transStr = 'transform ' + snapMs + 'ms ' + easeBack + ', opacity ' + snapMs + 'ms ease, filter ' + snapMs + 'ms ease';
                activeCard.style.transition = transStr;
                activeCard.style.transform = '';
                activeCard.style.opacity = '';

                if (nextCard) {
                  nextCard.style.transition = transStr;
                  nextCard.style.transform = '';
                  nextCard.style.opacity = '';
                  nextCard.style.filter = '';
                }

                // 动画结束后清理内联样式（避免影响后续真实滑动）
                setTimeout(function () {
                  activeCard.style.transition = '';
                  if (nextCard) nextCard.style.transition = '';
                  nudgingLocked = false;
                }, cleanupMs);
              }, holdMs);
            }
          }
          requestAnimationFrame(phase1);
        }

        // 如果用户在动画触发前就已经操作了（点、滑、滚），取消这次演示，避免"跟用户抢操作"
        function cancelNudge() {
          if (!nudged) nudged = true;
        }
        stackEl.addEventListener('touchstart', cancelNudge, { once: true, passive: true });
        stackEl.addEventListener('pointerdown', cancelNudge, { once: true });

        stackEl._nudge = nudge;   // 让外层 load 回调能调用这个方法

        // 每组自身的键盘切换入口
        stackEl._go = go;

        // 跳转到指定索引（无动画，供灯箱关闭时同步底层 stack 显示用）
        // 用法：stackEl._jumpTo(idx)，idx 是 0-based（0 = 同组第 1 张）
        stackEl._jumpTo = function (idx) {
          idx = (typeof idx === 'number') ? Math.floor(idx) : 0;
          cur = ((idx % N) + N) % N;  // 取模，防止越界
          render();
        };

        render();
      }

      // 全局标志：整个页面加载期间最多只会有一组被推一次
      var nudgingLocked = false;

      // ──── ★ 触发时机（进入页面后 → 自动滑动前 的等待策略） ────────────────────
      //
      //  triggerMode 四选一：
      //    'load'       = 等页面**全部资源**（所有组的所有图片）下载完 → 再 introDelay → 滑
      //                   （最稳但最慢，微信浏览器外网 CDN 慢时可能要 5~10 秒）
      //    'domready'   = HTML 结构解析好 → 再 introDelay → 滑
      //                   （启动快，但如果第一张图还没下完，就会"推白框"，不推荐）
      //    'firstimage' = ★（推荐默认）HTML 解析好后，**只等第一组的第一张图片**就绪
      //                   → 再 introDelay → 滑。兼顾"快"和"推的是真图不是白框"。
      //                   不需要等后面 2、3、4、5... 组的图片，
      //                   微信打开速度会比 'load' 快 3~8 倍。
      //    'instant'    = 立刻倒计时 introDelay → 滑，不等待任何事件。
      //
      //  introDelay：触发起点之后再额外等多少毫秒才真正推一下
      //              推荐 600 ~ 1500，太短显突兀、太长用户划走
      // ─────────────────────────────────────────────────────────────────────────────
      var triggerMode = 'firstimage';   // ★ 触发起点：'load' | 'domready' | 'firstimage' | 'instant'
      var introDelay = 600;            // ★ 触发起点后再等多少毫秒才开始自动滑动

      function scheduleNudge() {
        var firstStack = document.querySelector('.stack');
        if (!firstStack || !firstStack._nudge) return;

        // 用户在任何时刻有操作 → 不管三七二十一直接取消这次教学动画
        var userInteracted = false;
        function flag() { userInteracted = true; }
        window.addEventListener('touchstart', flag, { once: true, passive: true });
        window.addEventListener('pointerdown', flag, { once: true });
        window.addEventListener('wheel', flag, { once: true, passive: true });
        window.addEventListener('keydown', flag, { once: true });

        // 内部真正启动 introDelay 的函数
        function armTimer() {
          setTimeout(function () {
            if (!userInteracted && firstStack._nudge) firstStack._nudge();
          }, introDelay);
        }

        if (triggerMode !== 'firstimage') {
          // 其他三种模式：直接开始倒计时
          armTimer();
          return;
        }

        // —— 'firstimage' 模式：等第 0 组第 0 张图片 <img> 元素 complete 了才倒计时
        var firstImg = firstStack.querySelector('img');
        if (!firstImg) {
          armTimer();  // 兜底：找不到 img 就别等了
          return;
        }
        if (firstImg.complete && firstImg.naturalWidth > 0) {
          armTimer();  // 已经加载好了（缓存、本地文件等）→ 立刻倒计时
        } else {
          firstImg.addEventListener('load', armTimer, { once: true });
          firstImg.addEventListener('error', armTimer, { once: true });  // 图片加载失败也不能卡着不动
          // 兜底保险：如果 3.5 秒还没加载好（CDN 崩了、图 404 被 onerror 没触发等），也开始倒计时
          setTimeout(armTimer, 3500);
        }
      }

      if (triggerMode === 'load') {
        if (document.readyState === 'complete') scheduleNudge();
        else window.addEventListener('load', scheduleNudge);
      } else if (triggerMode === 'domready') {
        if (document.readyState !== 'loading') scheduleNudge();
        else document.addEventListener('DOMContentLoaded', scheduleNudge);
      } else if (triggerMode === 'firstimage') {
        // firstimage 需要 DOM 里已经有 <img> 元素，所以等 DOMContentLoaded
        if (document.readyState !== 'loading') scheduleNudge();
        else document.addEventListener('DOMContentLoaded', scheduleNudge);
      } else {
        scheduleNudge();
      }

      // 全局键盘方向键：自动定位到屏幕上可见度最高的那组来操作
      document.addEventListener('keydown', e => {
        const stacks = document.querySelectorAll('.stack');
        // 计算哪一组在视口里露出面积占比最高（用户"正在看"的那组）
        let best = null;
        let bestScore = -1;
        stacks.forEach(s => {
          const r = s.getBoundingClientRect();
          const vh = window.innerHeight;
          const visible = Math.max(0, Math.min(r.bottom, vh) - Math.max(r.top, 0));
          const score = visible / (r.bottom - r.top || 1);
          if (score > bestScore) { bestScore = score; best = s; }
        });
        if (best && bestScore > 0.3 && best._go) {
          if (e.key === 'ArrowLeft') best._go(-1, false);
          else if (e.key === 'ArrowRight') best._go(1, false);
        }
      });

      // ═══════════════════════════════════════════════════════════════════
      // 点击图片放大查看 —— 毛玻璃灯箱
      //   · 全局只建一个 DOM 单例，反复使用
      //   · 用 FLIP 动画：从被点击小图的精确位置 + 尺寸，放大到屏幕中央
      //     （视觉上像那张图自己"飞"起来放大了，而不是突兀弹一个弹窗）
      //   · 关闭方式：点背景任意地方 / 点右上角 × / 键盘 ESC / 安卓返回键
      // ═══════════════════════════════════════════════════════════════════
      (function initLightbox() {
        // 1) 懒创建：第一次有图片被点击时才把 DOM 插到 body 末尾，避免页面一打开就有冗余节点
        var overlay = null;
        var lbImg = null;
        var closeBtn = null;
        var prevBtn = null;
        var nextBtn = null;
        var counterEl = null;

        // —— 当前灯箱的「所在组」状态
        //    用来做同组上下切换：
        //    lb_stack  = 所属 .stack 元素
        //    lb_cards  = 该组所有 .card 元素（按 DOM 顺序 = 图片顺序）
        //    lb_curIdx = 当前灯箱内显示的是 cards 里的第几张（0-based）
        //    lb_N      = 该组一共有几张
        //    lb_switching = 正在切换动画中（防止快速连点叠加）
        var lb_stack = null;
        var lb_cards = null;
        var lb_curIdx = 0;
        var lb_N = 0;
        var lb_switching = false;

        // —— 灯箱内部（手机端手势用）滑动切换的私有状态
        //    手机端箭头隐藏了，用户靠在毛玻璃层左右滑动来切图。
        //    _lb_blockCloseClickUntil：滑动切换完成后的 320ms 内，「随后浏览器派
        //       发的 click 事件」要忽略，避免用户刚滑完 -> 灯箱就被"点空白关闭"关了。
        var _lb_dragOn = false;
        var _lb_dx0 = 0, _lb_dy0 = 0;
        var _lb_axis = null;
        var _lb_blockCloseClickUntil = 0;

        // —— 手机端双指缩放 / 平移 / 双击放大 的私有状态
        //   · _lb_zoomMode：出现双指后永久锁定为 true（直到所有手指都抬起）。
        //     在 zoomMode 内：单指移动 = 平移图片，不再触发左右切图。
        //   · lb_scale：当前缩放比例，1 = 原大，范围 [MIN, MAX]
        //   · lb_tx / lb_ty：缩放后的平移偏移（图片中心）
        //   · _lb_pointers：记录每个 pointerId 的 {x,y}，用于算双指距离 / 中心
        var _lb_zoomMode = false;
        var lb_scale = 1;
        var lb_tx = 0, lb_ty = 0;
        var LB_ZOOM_MIN = 1, LB_ZOOM_MAX = 3.2;
        var _lb_pointers = {};  // { [pointerId]: {x:number, y:number} }
        var _lb_zoomStartDist = 0;
        var _lb_zoomStartScale = 1;
        var _lb_zoomStartTx = 0, _lb_zoomStartTy = 0;
        var _lb_zoomStartCx = 0, _lb_zoomStartCy = 0;  // 双指中心（屏幕坐标）
        var _lb_lastTapAt = 0;
        var _lb_lastTapX = 0, _lb_lastTapY = 0;
        var DOUBLE_TAP_MS = 280;
        var DOUBLE_TAP_DIST = 20;
        var DOUBLE_TAP_SCALE = 2.0;

        // 把当前 scale / tx / ty 写到 lbImg.style.transform（不碰 transition）
        function applyZoomTransform() {
          if (!lbImg) return;
          lbImg.style.transform =
            'translate(' + lb_tx.toFixed(2) + 'px,' + lb_ty.toFixed(2) + 'px) ' +
            'scale(' + lb_scale.toFixed(4) + ')';
        }

        // 重置缩放 / 平移（切图前、关闭前调用）
        function resetZoom() {
          lb_scale = 1; lb_tx = 0; lb_ty = 0;
          _lb_zoomMode = false;
          _lb_pointers = {};
          applyZoomTransform();
        }

        function updateCounter() {
          if (!counterEl) return;
          if (lb_N > 1) {
            counterEl.textContent = (lb_curIdx + 1) + ' / ' + lb_N;
            counterEl.style.display = '';
            if (prevBtn) prevBtn.style.display = '';
            if (nextBtn) nextBtn.style.display = '';
          } else {
            counterEl.style.display = 'none';
            if (prevBtn) prevBtn.style.display = 'none';
            if (nextBtn) nextBtn.style.display = 'none';
          }
        }

        function ensureDom() {
          if (overlay) return;
          overlay = document.createElement('div');
          overlay.className = 'lightbox';
          overlay.setAttribute('role', 'dialog');
          overlay.setAttribute('aria-modal', 'true');

          lbImg = document.createElement('img');
          lbImg.className = 'lightbox-img';
          lbImg.alt = '';
          lbImg.draggable = false;

          closeBtn = document.createElement('button');
          closeBtn.type = 'button';
          closeBtn.className = 'lightbox-close';
          closeBtn.setAttribute('aria-label', '关闭');

          prevBtn = document.createElement('button');
          prevBtn.type = 'button';
          prevBtn.className = 'lightbox-prev';
          prevBtn.setAttribute('aria-label', '上一张');

          nextBtn = document.createElement('button');
          nextBtn.type = 'button';
          nextBtn.className = 'lightbox-next';
          nextBtn.setAttribute('aria-label', '下一张');

          counterEl = document.createElement('div');
          counterEl.className = 'lightbox-counter';

          // DOM 顺序：counter 在最下层(z-index:1) → close/prev/next 在上层(z-index:2)
          // prev/next 先 append（这样它们在 overlay click 判定时，target 命中按钮时才不会被误关）

            lbImg.style.transition = '';
            overlay.style.transition = '';

            // 最终状态：回到屏幕中心大图尺寸（translate(0,0) scale(1)），同时毛玻璃变不透明
            overlay.style.opacity = '1';
            lbImg.style.transform = 'translate(0,0) scale(1)';
          }

          // 现代浏览器 / 微信 7.0+：img.decode() 返回 Promise，精准确认像素已解码可用
          var decoded = false;
          if (lbImg.decode && typeof lbImg.decode === 'function') {
            lbImg.decode().then(function () { decoded = true; beginZoom(); })
              .catch(function () { if (!decoded) { decoded = true; beginZoom(); } });
          }
          // 兜底：如果 decode 不可用 / 超时，就用 complete 判断或 load 事件
          function fallbackReady() {
            if (decoded) return;
            decoded = true;
            beginZoom();
          }
          if (lbImg.complete && lbImg.naturalWidth > 0) {
            // 已经缓存就绪（如之前打开过同一图）— 立刻开始，不等 decode
            decoded = true;
            beginZoom();
          } else {
            lbImg.addEventListener('load', fallbackReady, { once: true });
            lbImg.addEventListener('error', fallbackReady, { once: true });
            setTimeout(fallbackReady, 2500);  // 极端兜底，2.5 秒后不管怎样都要开
          }
        }

        function closeLightbox() {
          if (!overlay || !overlay.classList.contains('is-open')) return;

          // 关闭前重置缩放：让 FLIP 飞回时按 1x 的真实尺寸算 bigRect，不然会飞歪
          resetZoom();
          try { lbImg.style.transition = ''; } catch (e) { }

          // 飞回到打开时那张小卡片的位置（如果小卡片被用户划走了也没关系，rect 记录的是它当时的坐标）
          var rect = lastSourceRect;

          // ★ 关键：如果用户在灯箱里切到了「另外一张」（例如从第 1 张切到第 3 张），
          //   那么 lastSourceRect 还是"第 3 张卡片被压在堆栈下面时的旧 rect"
          //   （因为它在下层，有 0.95 缩放 + 18px/10px 位移 + 变暗，不是顶层的位置）。
          //   我们要让它精确落到"同组卡片在顶层显示时"的位置（也就是 active/l0 的位置，
          //   因为同一组卡片大小完全一样），这样"关完后，顶层卡片立刻变成第 3 张"就无缝衔接。
          var syncTargetStack = null;
          var syncTargetIdx = -1;
          if (lb_stack && typeof lb_stack._jumpTo === 'function') {
            var activeCard = lb_stack.querySelector('.card.active') || lb_stack.querySelector('.card.l0');
            if (activeCard) {
              var ar = activeCard.getBoundingClientRect();
              if (ar && (ar.width > 0 || ar.height > 0)) rect = ar;
            }
            syncTargetStack = lb_stack;
            syncTargetIdx = lb_curIdx;
          }

          // ── ★ 时机 ①：灯箱放大图「起飞前」就同步 stack 并加过渡 ──────────────
          //    这样灯箱飞出的 0.35s 内，stack 内部所有卡片也同步平滑重排：
          //    新目标卡片从下层（l1/l2）"升上来"变成顶层 l0，旧卡片滑下去。
          //    0.35s 后放大图正好落到新卡片所在的顶层位置，用户看不到任何闪现。
          if (syncTargetStack && syncTargetIdx >= 0) {
            try { syncTargetStack.classList.add('is-syncing'); } catch (e) { }
            try { syncTargetStack._jumpTo(syncTargetIdx); } catch (e) { }
          }

          var bigRect = lbImg.getBoundingClientRect();

          if (rect && (rect.width > 0 || rect.height > 0)) {
            var scaleX = rect.width / bigRect.width;
            var scaleY = rect.height / bigRect.height;
            var tx = (rect.left + rect.width / 2) - (bigRect.left + bigRect.width / 2);
            var ty = (rect.top + rect.height / 2) - (bigRect.top + bigRect.height / 2);

            lbImg.classList.add('is-closing');
            // 从当前的 translate(0,0) scale(1) → 飞回小卡片位置/尺寸
            lbImg.style.transform =
              'translate(' + tx.toFixed(3) + 'px,' + ty.toFixed(3) + 'px) ' +
              'scale(' + ((scaleX + scaleY) / 2).toFixed(4) + ')';
            lbImg.style.opacity = '1';  // 全程可见，无缝落回卡片上
          } else {
            // 找不到原位置（极端情况）：轻微缩小 + 淡出，至少不跳
            lbImg.classList.add('is-closing');
            lbImg.style.transform = 'scale(0.92)';
            lbImg.style.opacity = '0';
          }

          // 毛玻璃同步淡出（和缩放时长一致）
          overlay.style.opacity = '0';

          var DURATION = 350;  // 与 CSS is-closing transform 时长接近，留一点安全余量
          var _stackCleanClass = syncTargetStack;
          setTimeout(function () {
            overlay.classList.remove('is-open');
            overlay.style.opacity = '';
            document.body.classList.remove('lightbox-open');

            lbImg.classList.remove('is-animating', 'is-closing', 'is-switching');
            lbImg.style.transition = '';
            lbImg.style.transform = '';
            lbImg.style.opacity = '';
            lbImg.removeAttribute('src');

            lb_switching = false;

            // ── ★ 时机 ②：0.35s 过渡完成，清理临时 is-syncing class ──
            //    _jumpTo 已经在「起飞前」同步调用过了，这里不能再调，否则会再切一次。
            if (_stackCleanClass) {
              try { _stackCleanClass.classList.remove('is-syncing'); } catch (e) { }
            }
          }, DURATION);
        }

        // ════════════════════════════════════════════════════════════════
        // 触发方式：推翻之前的「自建 down/move/up 检测器」，改回用浏览器原生 click 事件。
        //
        // 为什么上一版自建检测器在用户真实手机上老失灵？
        //   1. stack.onPointerDown 里有 e.stopPropagation() + setPointerCapture，
        //      会打乱 pointer / mouse / touch 三套事件在某些浏览器/某些安卓版本
        //      下的派发顺序，导致 onDown 根本没收到、或 dragCanceled 永远 true。
        //   2. 自建判定的阈值、打标时机、互斥窗口「叠」得太复杂，真实设备下
        //      只要一步顺序错了就整锅翻车。
        //
        // —— 最终方案（最简单、同时也最稳）：
        //   A. 点击判定：**全靠 document click 监听器**（浏览器帮你做好所有「什么是
        //      一次点击」的判断，包括 preventDefault、位移、起终点一致性等——人家在
        //      Win/Mac/iOS/Android/微信上跑了十几年，比我手写的靠谱一万倍）。
        //   B. 防滑动误触：stack 的滑动手势代码里，「手势真正开始拖动（dx>12 且水平）
        //      或真的触发 go() 切换」时，就写一个全局时间戳 __lb_blockNextClickUntil
        //      = now + 350ms（足够覆盖浏览器把 click 派发出来的时间窗口）。
        //   C. 在 click 监听器开头，如果 now < blockUntil，就直接 return，
        //      不放大。这就把「滑动手势后的 click」100% 拦掉了。
        //
        //   为什么能拦住「第二张图」那个老 bug？
        //     滑动结束 = commit() 写了 blockUntil，350ms 内 click 全毙。
        //     「切到第二张 → click 冒泡 → 取 active img」那套流程，发生时间点
        //     就在松手后的 0~100ms 内，正好撞进 blockUntil 窗口。
        //   为什么单击反而能放大？
        //     真正的单击：没有拖动 → 滑动手势那边根本不会写 blockUntil →
        //     click 直接命中 → 放大。完美对应人类的直觉。
        // ════════════════════════════════════════════════════════════════

        function isCardImg(el) {
          return !!(el && el.tagName === 'IMG' &&
            el.parentElement && el.parentElement.classList &&
            el.parentElement.classList.contains('card'));
        }

        // ★ 命中目标解析器（防各种浏览器/微信 X5 的「点 img 却把事件派到父容器」的怪癖）
        function resolveLightboxImg(tapTargetEl) {
          if (!tapTargetEl) return null;
          if (isCardImg(tapTargetEl)) return tapTargetEl;

          var card, stack;
          if (tapTargetEl.closest) {
            card = tapTargetEl.closest('.card');
            stack = tapTargetEl.closest('.stack');
          } else {
            var n = tapTargetEl;
            while (n) {
              if (!card && n.classList && n.classList.contains('card')) card = n;
              if (!stack && n.classList && n.classList.contains('stack')) stack = n;
              if (card && stack) break;
              n = n.parentElement;
            }
          }
          if (card) {
            var imgA = card.querySelector('img');
            if (imgA) return imgA;
          }
          if (stack) {
            var imgB = stack.querySelector('.card.active img') ||
              stack.querySelector('.card.l0 img') ||
              stack.querySelector('.card img');
            if (imgB) return imgB;
          }
          return null;
        }

        // —— 滑动 vs 点击 互斥锁（极简版）
        //    blockUntil 有效期间内的 click 一律视为「滑动后遗漏的 click 事件」→ 跳过。
        //    正常的单击：因为没达到过「dx≥12 的水平拖拽」，blockUntil 不会被写 → 直接放大。
        function clickBlocked() {
          try {
            var t = window.__lb_blockNextClickUntil;
            if (!t) return false;
            var now = Date.now ? Date.now() : new Date().getTime();
            return now < t;
          } catch (err) { return false; }
        }

        document.addEventListener('click', function (e) {
          // 1) 在互斥窗口内 → 一定是刚才滑动手势剩下来的 click，不开灯箱
          if (clickBlocked()) return;

          var imgEl = resolveLightboxImg(e.target);
          if (imgEl) {
            // 防止 click 冒泡触发 a 标签跳转（将来如果包了 a）
            if (e.cancelable) { try { e.preventDefault(); } catch (err) { } }
            openLightbox(imgEl);
          }
        }, false);
      })();
    })();
  </script>

</body>
